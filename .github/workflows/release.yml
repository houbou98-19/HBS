name: Build Release Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.NEW_VERSION }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      
      - name: Get latest tag and bump version
        id: version
        run: |
          # Fetch all tags from remote
          git fetch --tags
          
          LATEST=$(python3 << 'PYTHON'
          import subprocess
          tags = subprocess.check_output(['git', 'tag', '-l']).decode().strip().split('\n')
          tags = [t.lstrip('v') for t in tags if t]
          tags = [t for t in tags if t and t[0].isdigit()]
          tags.sort(key=lambda x: tuple(map(int, x.split('.'))))
          result = tags[-1] if tags else '1.0.0'
          print(result)
          PYTHON
          )
          
          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          
          # Bump version based on input
          case "${{ github.event.inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Create git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          TAG="${{ steps.version.outputs.NEW_VERSION }}"
          # Ensure no 'v' prefix
          TAG=${TAG#v}
          
          git tag "$TAG"
          git push origin "$TAG"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hbs-changed: ${{ steps.changes.outputs.hbs }}
      carousel-changed: ${{ steps.changes.outputs.carousel }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      
      - name: Detect what changed
        id: changes
        run: |
          git fetch --tags
          
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, check all files
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            # Check what changed since last tag
            CHANGED=$(git diff --name-only $PREV_TAG..HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED"
          
          if echo "$CHANGED" | grep -qE '(carousel\.py|installer/carousel)'; then
            echo "carousel=true" >> $GITHUB_OUTPUT
          else
            echo "carousel=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED" | grep -qE '(hbs\.py|routes/|config\.json|install\.sh|launcher\.sh)'; then
            echo "hbs=true" >> $GITHUB_OUTPUT
          else
            echo "hbs=false" >> $GITHUB_OUTPUT
          fi

  build-hbs:
    needs: [version, detect-changes]
    if: needs.detect-changes.outputs.hbs-changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller flask requests
      
      - name: Update version in config
        run: |
          python3 << 'PYTHON'
          import json
          with open('config.json') as f:
              config = json.load(f)
          config['version'] = '${{ needs.version.outputs.new-version }}'
          with open('config.json', 'w') as f:
              json.dump(config, f, indent=2)
          PYTHON
      
      - name: Build HBS
        run: |
          cd installer/linux/hbs
          pyinstaller hbs.spec --distpath ./dist --buildpath ./build
          cd dist
          tar -czf ../../hbs-${{ needs.version.outputs.new-version }}.tar.gz hbs/
      
      - name: Upload HBS Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.new-version }}
          files: installer/hbs-${{ needs.version.outputs.new-version }}.tar.gz
          body: "HBS Backend v${{ needs.version.outputs.new-version }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-carousel:
    needs: [version, detect-changes]
    if: needs.detect-changes.outputs.carousel-changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller pyglet requests
      
      - name: Build Carousel
        run: |
          cd installer/linux/carousel
          pyinstaller carousel.spec --distpath ./dist --buildpath ./build
          cd dist
          tar -czf ../../carousel-${{ needs.version.outputs.new-version }}.tar.gz hbs-carousel/
      
      - name: Upload Carousel Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.new-version }}
          files: installer/carousel-${{ needs.version.outputs.new-version }}.tar.gz
          body: "Carousel Frontend v${{ needs.version.outputs.new-version }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}